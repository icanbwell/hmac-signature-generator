name: "Build and Test"

on:
  pull_request:
    branches:
      - "main"
    types: [opened, synchronize, reopened]

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - id: install
        name: Install
        run: npm ci

      - id: build
        name: Build
        run: npm run build
      
      - id: install-playwright
        name: Install Playwright Browsers
        run: npx playwright install

      - id: test
        name: Test
        run: |
          npm run test
